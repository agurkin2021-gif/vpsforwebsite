<!doctype html><html><head><meta charset="utf-8"><title>QA mobile bundled</title></head><body style="margin:0;background:#d1d5db;display:flex;justify-content:center;align-items:flex-start"><iframe id="qa" style="width:390px;height:12000px;border:0;background:white"></iframe><script>
const p=new URLSearchParams(location.search);
const a=p.get('a')||'';
const t=p.get('t')||'';
const f=document.getElementById('qa');
f.src='qa-render-current.html'+(a?'#'+encodeURIComponent(a):'');
f.addEventListener('load',()=>{
  if(t){
    try{
      const els=[...f.contentDocument.querySelectorAll('h1,h2,h3')];
      const el=els.find(x=>x.textContent.trim()===t);
      if(el) f.contentWindow.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+f.contentWindow.scrollY-105));
    }catch(e){}
  }
});
</script></body></html>
