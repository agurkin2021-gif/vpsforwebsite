<!doctype html><html><head><meta charset="utf-8"><title>QA mobile current</title></head><body style="margin:0;background:#d1d5db;display:flex;justify-content:center;align-items:flex-start"><iframe id="qa" style="width:390px;height:10000px;border:0;background:white"></iframe>
<script>
const p=new URLSearchParams(location.search);
const a=p.get('a')||'';
const t=p.get('t')||'';
const frame=document.getElementById('qa');
frame.src='https://raw.githack.com/agurkin2021-gif/vpsforwebsite/preview/'+(a?'#'+encodeURIComponent(a):'');
frame.addEventListener('load',()=>{
  try{
    if(t){
      const els=[...frame.contentDocument.querySelectorAll('h1,h2,h3')];
      const el=els.find(x=>x.textContent.trim()===t);
      if(el) frame.contentWindow.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+frame.contentWindow.scrollY-110),behavior:'instant'});
    }
  }catch(e){}
});
</script></body></html>
