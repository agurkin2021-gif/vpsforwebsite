  // Queue the visit immediately. Load can precede the first visible frame,

  (function () {
    var started = false;
    var observer;
    function loadAnalytics() {
      if (started) return;
      started = true;
      if (observer) observer.disconnect();
      document.removeEventListener('visibilitychange', onVisibilityChange);
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.Config.Services.GoogleAnalytics.ID }}';
      document.head.appendChild(script);

          PerformanceObserver.supportedEntryTypes.indexOf('paint') === -1 ||
          performance.getEntriesByName('first-contentful-paint').length) {
        loadAnalytics();
        return;
      }
      document.addEventListener('visibilitychange', onVisibilityChange);
      try {
        observer = new PerformanceObserver(function (list) {
          if (list.getEntries().some(function (entry) {
            return entry.name === 'first-contentful-paint';
          })) loadAnalytics();
