<!-- Google tag (gtag.js) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.Config.Services.GoogleAnalytics.ID }}');
  // Queue the visit immediately, then give the page's own assets the connection first.
  // No interaction, timer, or user-agent check is required to start analytics.
  (function () {
    function loadAnalytics() {
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.Config.Services.GoogleAnalytics.ID }}';
      document.head.appendChild(script);
    }
    if (document.readyState === 'complete') loadAnalytics();
    else window.addEventListener('load', loadAnalytics, { once: true });
  })();
</script>
