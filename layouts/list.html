{{ define "main" }}
  {{ partial "page-header" . }}

  {{ if and (in (slice "ko" "de" "it") .Language.Lang) (or (eq .Section "about") (eq .Section "contact")) }}
    <section class="section-sm">
      <div class="container">
        <div class="row justify-center">
          <div class="lg:col-10">
            <div class="content">{{ .Content }}</div>
          </div>
        </div>
      </div>
    </section>
  {{ else }}
  <div class="section">
    <div class="container">
      <ul class="text-center">
        {{ range .RegularPages }}
          <li class="m-3">
            <a
              href="{{ .Permalink }}"
              class="text-text-dark dark:text-darkmode-text-dark block text-xl">
              {{ .Title }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </div>
  {{ end }}
{{ end }}
