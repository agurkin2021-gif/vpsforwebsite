{{- if eq .Page.Language.Lang "ko" -}}
  {{- $url := partial "localized-url.html" .Destination -}}
  <a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix .Destination "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
{{- else -}}
  {{- /* Preserve the theme module's behavior for existing languages. */ -}}
  <a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix .Destination "http" }} target="_blank"{{ end }}{{ if in .Destination "?class=" }}{{ $getClass := string (index (findRE "class=([^&#]*)" .Destination) 0) }}{{ $allClass := replace $getClass `class=` `` }}{{ $class := replace $allClass `+` ` ` }} class="{{ $class }}"{{ end }}>{{ .Text | safeHTML }}</a>
{{- end -}}
