name: Korean security checklist prepublication QA
on:
  push:
    branches: ["work/ko-security-20261020"]
    paths:
      - "content/korean/vps-security-checklist.md"
      - "layouts/_partials/page-header.html"
      - "layouts/_markup/render-link.html"
      - ".github/workflows/qa-ko-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true
      - name: Install dependencies and render source
        shell: bash
        run: |
          npm install --no-audit --no-fund
          hugo mod get
          cat static/images/home/vps-hero-right.webp.b64.* | tr -d '\n' | base64 --decode > static/images/home/vps-hero-right.webp
          hugo --gc --minify --baseURL "https://vpsforwebsite.com/"
          node scripts/optimize-css.mjs public
          test -s public/ko/vps-보안-점검표/index.html
      - name: Verify source parity with English
        shell: bash
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const en=fs.readFileSync('content/english/vps-security-checklist.md','utf8');
          const ko=fs.readFileSync('content/korean/vps-security-checklist.md','utf8');
          const match=(s,re)=>Array.from(s.matchAll(re),m=>m[1]||m[0]);
          const headings=match(en,/^#{2,3}\s+(.+)$/gm);
          const koHeadings=match(ko,/^#{2,3}\s+(.+)$/gm);
          const slug=s=>s.toLowerCase().replace(/[^a-z0-9 -]/g,'').trim().replace(/\s+/g,'-');
          const anchors=match(ko,/^#{2,3}\s+.*\{#([\w-]+)\}$/gm);
          assert.equal(headings.length,34);
          assert.equal(koHeadings.length,34);
          assert.deepEqual(anchors,headings.map(slug),'34 English section IDs preserved');
          const count=(s,re)=>match(s,re).length;
          for(const re of [/^\|.*\|$/gm,/^- /gm,/^\d+\. /gm,/^```/gm,/<script>/g,/<select\s/g,/<option\s/g,/<form\s/g]){
            assert.equal(count(en,re),count(ko,re),'Structural parity '+String(re));
          }
          assert.deepEqual(match(en,/<select[^>]*id="([^"]+)"/g),match(ko,/<select[^>]*id="([^"]+)"/g));
          assert.deepEqual(match(en,/<option[^>]*value="([^"]+)"/g),match(ko,/<option[^>]*value="([^"]+)"/g));
          assert.deepEqual(match(en,/\{\{<\s*relref\s+(?:path=)?"([^"]+)"/g),match(ko,/\{\{<\s*relref\s+(?:path=)?"([^"]+)"/g));
          const codeBlocks=s=>match(s,/```([\s\S]*?)```/g);
          assert.deepEqual(codeBlocks(en),codeBlocks(ko),'Code blocks unchanged');
          const script=s=>s.match(/<script>[\s\S]*?<\/script>/)[0].replace(/result = [^\n]*;/g,'result = LOCALIZED_MESSAGE;');
          assert.equal(script(en),script(ko),'JS logic identical apart from localized messages');
          const nums=s=>match(s,/(?<![a-zA-Z0-9])(?:\d+(?:\.\d+)?)(?:%|GB|TB)?/g).sort();
          assert.deepEqual(nums(en),nums(ko),'Numeric literals unchanged');
          console.log('PASS 34 anchored headings, 19 table rows, 128 bullets, 30 ordered steps, links, commands, HTML controls and unchanged JS');
          JS
      - name: Start HTTP server and browser dependencies
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/ko-security-http.log 2>&1 &
          mkdir -p /tmp/ko-security-browser
          cd /tmp/ko-security-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test rendered page, responsive layout and all 512 form states
        shell: bash
        run: |
          cd /tmp/ko-security-browser
          mkdir -p shots
          cat > check.cjs <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const slug='vps-보안-점검표';
          const url='http://127.0.0.1:8765/ko/'+encodeURIComponent(slug)+'/';
          const ids=['sec-recovery','sec-admin','sec-firewall','sec-services','sec-updates','sec-backup','sec-logs','sec-app','sec-owner'];
          const anchors=['security-baseline-in-order','vps-security-baseline-checker','keep-a-recovery-path-before-changing-access','inventory-exposed-services-before-blocking','harden-administrative-access','root-login-and-password-authentication','firewall-only-the-services-you-need','provider-firewall-and-host-firewall','keep-databases-and-internal-services-private-by-default','patching-and-automatic-security-updates','fail2ban-crowdsec-and-rate-limiting','least-privilege-for-applications-and-databases','protect-secrets-and-credentials','control-panels-and-admin-interfaces','application-cms-and-runtime-updates','https-protects-transport-not-the-whole-server','ddos-protection-is-not-application-security','backups-are-a-security-control','logs-alerts-and-audit-trail','after-a-suspected-compromise','repeat-the-checklist','production-security-checklist','technical-references','faq','what-should-i-secure-first-on-a-new-vps','should-i-disable-ssh-password-login','should-i-change-the-ssh-port','do-i-need-fail2ban','which-ports-should-be-open-on-a-vps','does-a-firewall-protect-a-vulnerable-application','are-automatic-security-updates-enough','is-https-enough-to-secure-a-vps','is-vdsina-ddos-protection-enough-to-secure-the-website','what-should-i-do-if-i-suspect-the-vps-was-compromised'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [390,1280]){
                const context=await browser.newContext({viewport:{width,height:850},isMobile:width===390,hasTouch:width===390});
                const page=await context.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto(url,{waitUntil:'load',timeout:60000});
                assert.equal(response.status(),200);
                assert.equal((await page.title()).trim(),'VPS 보안 점검표');
                assert.deepEqual(await page.locator('h1').allTextContents(),['VPS 보안 점검표']);
                assert.equal(await page.locator('h2,h3').count(),34);
                assert.equal(await page.locator('table').count(),1);
                assert.equal(await page.locator('#vps-security-checker select').count(),9);
                assert.equal(await page.locator('#vps-security-checker option').count(),18);
                for(const id of anchors)assert.equal(await page.locator('[id="'+id+'"]').count(),1,'Missing or repeated anchor '+id);
                assert.equal(await page.locator('link[rel="canonical"]').count(),1);
                assert.equal(await page.locator('.vps-security-hero-diagram').count(),1);
                assert((await page.locator('.vps-security-hero-diagram').innerText()).includes('올바른 순서로 보안 강화'));
                assert((await page.locator('body').innerText()).includes('제휴 고지'));
                const links=await page.locator('a[href*="partner=ni8gzrvz75"]').evaluateAll(a=>a.map(x=>x.getAttribute('rel')));
                assert(links.length>=3,'Affiliate links present');
                assert(links.every(x=>x&&x.includes('nofollow')&&x.includes('sponsored')));
                const bad=await page.locator('a[href^="//"]').count();
                assert.equal(bad,0,'No protocol-relative links');
                const pos=await page.evaluate(()=>{
                  const d=document.documentElement,b=document.body;
                  return {viewport:d.clientWidth,html:d.scrollWidth,body:b.scrollWidth,boxes:[...document.querySelectorAll('header,h1,.vps-security-hero-grid,#vps-security-checker')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,left:r.left,right:r.right,width:r.width}})};
                });
                console.log('GEOMETRY',width,JSON.stringify(pos));
                assert(pos.html<=width+2&&pos.body<=width+2,'Horizontal overflow');
                for(const e of pos.boxes)if(e.width>0)assert(e.left>=-2&&e.right<=width+2,'Out of bounds: '+JSON.stringify(e));
                await page.screenshot({path:'shots/security-'+width+'.png',fullPage:true});
                if(width===390){
                  const actual=await page.evaluate((ids)=>{
                    const out=[],form=document.getElementById('vps-security-checker'),result=document.getElementById('vps-security-result');
                    for(let mask=0;mask<512;mask++){
                      ids.forEach((id,i)=>document.getElementById(id).value=(mask&(1<<i))?'yes':'no');
                      form.requestSubmit();
                      out.push(result.textContent);
                    }
                    return out;
                  },ids);
                  assert.equal(actual.length,512);
                  let cases=[0,0,0];
                  for(let mask=0;mask<512;mask++){
                    const misses=ids.filter((_,i)=>!(mask&(1<<i))).length;
                    const critical=[0,1,2,4,5,8].filter(i=>!(mask&(1<<i))).length;
                    const expect=critical>=2?'중대한 누락:':misses?'기본 보안 미완료:':'운영 기본 보안 준비 완료:';
                    assert(actual[mask].startsWith(expect),'Wrong outcome for mask '+mask+': '+actual[mask]);
                    cases[expect==='중대한 누락:'?0:expect==='기본 보안 미완료:'?1:2]++;
                    if(critical<2&&misses>0)assert(actual[mask].includes(String(misses)+'개 항목'));
                  }
                  console.log('PASS 512 browser submits, outcome counts',JSON.stringify(cases));
                  await page.locator('#sec-recovery').selectOption('yes');
                  await page.locator('#sec-admin').selectOption('yes');
                  await page.locator('#vps-security-checker button[type=submit]').click();
                  assert((await page.locator('#vps-security-result').innerText()).startsWith('중대한 누락:'));
                }
                assert.deepEqual(errors,[],'Page JS errors');
                console.log('PASS width',width);
                await context.close();
              }
            }finally{await browser.close();}
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1;});
          JS
          node check.cjs
      - name: Preserve QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-security-prepublication
          path: /tmp/ko-security-browser/shots/*.png
          retention-days: 7
          if-no-files-found: ignore
