name: Emergency recover Cloudflare cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-cloudflare-cache.yml"
      - "scripts/recover_cloudflare_cache.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-cache-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 brotli

      - name: Recover currently cached production responses
        run: |
          rm -rf recovered-public recovery-manifest.json
          python scripts/recover_cloudflare_cache.py

      - name: Commit emergency recovery snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-public recovery-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Recover vpsforwebsite.com from Cloudflare cache"
          git pull --rebase origin main
          git push
