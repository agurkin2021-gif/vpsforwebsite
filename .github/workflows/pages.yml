name: Build Hugo site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install node dependencies
        run: npm install

      - name: Resolve Hugo modules
        run: hugo mod get

      - name: Build
        run: hugo --gc --minify --baseURL "https://agurkin2021-gif.github.io/vpsforwebsite/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpsforwebsite-public
          path: ./public
