name: Publish multilingual Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install dependencies
        run: npm install

      - name: Resolve Hugo modules
        run: hugo mod get

      - name: Restore homepage visual
        shell: bash
        run: |
          cat static/images/home/vps-hero-right.webp.b64.* | tr -d '\n' | base64 --decode > static/images/home/vps-hero-right.webp
          test -s static/images/home/vps-hero-right.webp

      - name: Warm Tailwind build stats
        run: hugo --gc --baseURL "https://agurkin2021-gif.github.io/vpsforwebsite/"

      - name: Build published website
        run: |
          rm -rf public
          hugo --gc --minify --baseURL "https://agurkin2021-gif.github.io/vpsforwebsite/"
          node scripts/optimize-css.mjs public
          test -s public/index.html
          test -s public/es/index.html
          grep -q 'VPS para alojar sitios web' public/es/index.html
          grep -q 'data-language-switcher' public/es/index.html
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload published website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
