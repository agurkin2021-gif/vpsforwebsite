name: Build Hugo preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install node dependencies
        run: npm install

      - name: Resolve Hugo modules
        run: hugo mod get

      - name: Warm build stats
        run: hugo --gc --baseURL "https://raw.githack.com/agurkin2021-gif/vpsforwebsite/preview/"

      - name: Build preview with complete Tailwind utilities
        run: hugo --gc --minify --baseURL "https://raw.githack.com/agurkin2021-gif/vpsforwebsite/preview/"

      - name: Make preview portable
        shell: python
        run: |
          from pathlib import Path
          import re

          prefix = "/agurkin2021-gif/vpsforwebsite/preview/"
          target = "https://raw.githack.com/agurkin2021-gif/vpsforwebsite/preview/"
          suffixes = {".html", ".css", ".js", ".json", ".xml", ".webmanifest"}

          for path in Path("public").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue

              text = path.read_text(encoding="utf-8")
              text = text.replace(prefix, target)

              if path.suffix.lower() == ".html":
                  text = re.sub(
                      r"\\s+integrity=(?:\"[^\"]*\"|'[^']*'|[^\\s>]+)",
                      "",
                      text,
                  )

              path.write_text(text, encoding="utf-8")

      - name: Remove preview sitemap
        run: rm -f public/sitemap.xml public/sitemap.xml.gz

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview
          publish_dir: ./public
          force_orphan: true
