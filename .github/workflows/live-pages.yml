name: Deploy live Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install node dependencies
        run: npm install

      - name: Resolve Hugo modules
        run: hugo mod get

      - name: Warm build stats
        run: hugo --gc --baseURL "https://vpsforwebsite.com/"

      - name: Build production site with complete Tailwind utilities
        run: hugo --gc --minify --baseURL "https://vpsforwebsite.com/"

      - name: Verify production homepage SEO output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path("public/index.html")
          if not p.exists():
              raise SystemExit("public/index.html was not generated")

          html = p.read_text(encoding="utf-8")

          checks = {
              "robots index,follow": bool(re.search(r'<meta[^>]+name=["\']?robots["\']?[^>]+content=["\']index,follow["\']', html, re.I)
                                            or re.search(r'<meta[^>]+content=["\']index,follow["\'][^>]+name=["\']?robots["\']?', html, re.I)),
              "canonical": bool(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']https://vpsforwebsite\.com/["\']', html, re.I)
                                 or re.search(r'<link[^>]+href=["\']https://vpsforwebsite\.com/["\'][^>]+rel=["\']canonical["\']', html, re.I)),
              "hreflang en": bool(re.search(r'<link[^>]+hreflang=["\']en["\'][^>]+href=["\']https://vpsforwebsite\.com/["\']', html, re.I)
                                   or re.search(r'<link[^>]+href=["\']https://vpsforwebsite\.com/["\'][^>]+hreflang=["\']en["\']', html, re.I)),
              "hreflang x-default": bool(re.search(r'<link[^>]+hreflang=["\']x-default["\'][^>]+href=["\']https://vpsforwebsite\.com/["\']', html, re.I)
                                          or re.search(r'<link[^>]+href=["\']https://vpsforwebsite\.com/["\'][^>]+hreflang=["\']x-default["\']', html, re.I)),
              "WebSite JSON-LD": '"@type":"WebSite"' in html,
              "WebPage JSON-LD": '"@type":"WebPage"' in html,
          }

          for name, ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'FAIL'}")

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Production SEO verification failed: " + ", ".join(failed))

          h1s = re.findall(r'<h1\b[^>]*>(.*?)</h1>', html, re.I | re.S)
          h1s = [re.sub(r'<[^>]+>', '', x).strip() for x in h1s]
          print("H1:", h1s)
          if h1s != ["VPS for website"]:
              raise SystemExit(f"Expected exactly one homepage H1 'VPS for website', got: {h1s}")

          print("Production homepage SEO verification: PASS")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
