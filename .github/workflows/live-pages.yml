name: Validate production Hugo build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://vpsforwebsite.com

concurrency:
  group: production-validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install node dependencies
        run: npm install

      - name: Resolve Hugo modules
        run: hugo mod get

      - name: Decode homepage hero visual
        shell: bash
        run: |
          cat static/images/home/vps-hero-right.webp.b64.* | tr -d '\n' | base64 --decode > static/images/home/vps-hero-right.webp
          test -s static/images/home/vps-hero-right.webp
          file static/images/home/vps-hero-right.webp

      - name: Warm build stats
        run: hugo --gc --baseURL "${{ env.PRODUCTION_BASE_URL }}/"

      - name: Clear warm-build output
        run: rm -rf public

      - name: Build production site with complete Tailwind utilities
        run: hugo --gc --minify --baseURL "${{ env.PRODUCTION_BASE_URL }}/"

      - name: Optimize CSS for each generated page
        run: node scripts/optimize-css.mjs public

      - name: Verify production homepage SEO metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          import os

          p = Path("public/index.html")
          if not p.exists():
              raise SystemExit("public/index.html was not generated")

          html = p.read_text(encoding="utf-8")

          class HeadAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.metas = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  data = {k.lower(): (v or "") for k, v in attrs}
                  if tag.lower() == "meta":
                      self.metas.append(data)
                  elif tag.lower() == "link":
                      self.links.append(data)

          audit = HeadAudit()
          audit.feed(html)

          expected_url = os.environ["PRODUCTION_BASE_URL"].rstrip("/") + "/"
          print("Expected production base URL:", expected_url)

          robots = any(x.get("name","").lower() == "robots" and x.get("content","").lower() == "index,follow" for x in audit.metas)
          canonical = any(x.get("rel","").lower() == "canonical" and x.get("href") == expected_url for x in audit.links)
          hreflang_en = any(x.get("hreflang","").lower() == "en" and x.get("href") == expected_url for x in audit.links)
          hreflang_default = any(x.get("hreflang","").lower() == "x-default" and x.get("href") == expected_url for x in audit.links)

          checks = {
              "robots index,follow": robots,
              "canonical": canonical,
              "hreflang en": hreflang_en,
              "hreflang x-default": hreflang_default,
              "WebSite JSON-LD": '"@type":"WebSite"' in html,
              "WebPage JSON-LD": '"@type":"WebPage"' in html,
          }

          for name, ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'FAIL'}")

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              print("LINK TAGS:", audit.links)
              raise SystemExit("Production SEO verification failed: " + ", ".join(failed))

          h1s = re.findall(r'<h1\b[^>]*>(.*?)</h1>', html, re.I | re.S)
          h1s = [re.sub(r'<[^>]+>', '', x).strip() for x in h1s]
          print("H1:", h1s)
          if h1s != ["VPS for website"]:
              raise SystemExit(f"Expected exactly one homepage H1 'VPS for website', got: {h1s}")

          print("Production homepage SEO verification: PASS")
          PY
