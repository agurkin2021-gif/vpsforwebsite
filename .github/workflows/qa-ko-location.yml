name: Korean VPS Location prepublication QA
on:
  push:
    branches: ["work/ko-location-20261020"]
    paths:
      - "content/korean/how-to-choose-vps-location.md"
      - "layouts/_partials/page-header.html"
      - ".github/workflows/qa-ko-location.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true
      - name: Hugo production build
        run: |
          npm install --no-audit --no-fund
          hugo mod get
          cat static/images/home/vps-hero-right.webp.b64.* | tr -d '\n' | base64 --decode > static/images/home/vps-hero-right.webp
          hugo --gc --minify --baseURL "https://vpsforwebsite.com/"
          node scripts/optimize-css.mjs public
          test -s public/ko/vps-서버-위치-선택-방법/index.html
      - name: Source and rendered parity
        run: |
          node <<'JS'
          const fs=require('fs'),a=require('assert').strict,cp=require('child_process');
          const en=fs.readFileSync('content/english/how-to-choose-vps-location.md','utf8');
          const ko=fs.readFileSync('content/korean/how-to-choose-vps-location.md','utf8');
          const m=(s,re)=>[...s.matchAll(re)].map(x=>x[1]??x[0]);
          const enH=m(en,/^#{2,3}\s+(.+)$/gm);
          const koH=m(ko,/^#{2,3}\s+.*\{#([a-z0-9-]+)\}$/gm);
          a.equal(enH.length,48);a.equal(koH.length,48);
          for(const re of [/^\|.*\|$/gm,/^- /gm,/^\d+\. /gm,/^\x60{3}/gm,/<form\b/g,/<select\b/g,/<option\b/g,/<script>/g,/<a\b/g])
            a.equal(m(en,re).length,m(ko,re).length,'Structure '+re);
          a.equal(m(ko,/^\|.*\|$/gm).length,34);
          a.equal(m(ko,/^- /gm).length,140);
          a.equal(m(ko,/<select\b/g).length,6);
          a.equal(m(ko,/<option\b/g).length,16);
          for(const re of [/<select[^>]*id="([^"]+)"/g,/<option[^>]*value="([^"]+)"/g,/\{\{<\s*relref\s+"([^"]+)"/g,/href="([^"]+)"/g])
            a.deepEqual(m(en,re),m(ko,re),'Identifiers and links '+re);
          const code=s=>m(s,/\x60{3}[\s\S]*?\x60{3}/g);
          a.deepEqual(code(en),code(ko),'Commands unchanged');
          const script=s=>s.match(/<script>[\s\S]*?<\/script>/)[0].replace(/result = [^\n]*;/g,'result = LOCALIZED;');
          a.equal(script(en),script(ko),'JS conditions unchanged');
          const nums=s=>m(s.replace(/\{#[\w-]+\}/g,''),/(?<![A-Za-z0-9])(?:\d+(?:\.\d+)?)(?:%|GB|TB)?/g).sort();
          a.deepEqual(nums(en),nums(ko),'Numbers unchanged');
          const part=s=>{const p=s.indexOf('{{ else if $isVpsLocation }}');a(p>=0);return s.slice(p,s.indexOf('{{ else if $isVpsControlPanel }}',p));};
          const hero=fs.readFileSync('layouts/_partials/page-header.html','utf8');
          const base=cp.execFileSync('git',['show','origin/main:layouts/_partials/page-header.html'],{encoding:'utf8'});
          const stripped=part(hero).replace(/\{\{ if eq \.Language\.Lang "ko" \}\}[\s\S]*?\{\{ else \}\}([\s\S]*?)\{\{ end \}\}/g,'$1');
          a.equal(stripped,part(base),'Original EN/non-KO hero unchanged');
          const idList=s=>[...s.matchAll(/<h[23]\s+id=(?:"([^"]+)"|([^\s>]+))/g)].map(x=>x[1]||x[2]);
          const enh=fs.readFileSync('public/how-to-choose-vps-location/index.html','utf8');
          const koh=fs.readFileSync('public/ko/vps-서버-위치-선택-방법/index.html','utf8');
          a.deepEqual(idList(enh),idList(koh),'48 rendered IDs');
          a.deepEqual(koH,idList(enh),'source explicit IDs');
          a(koh.includes('VPS 서버 위치 선택 방법'));
          a(koh.includes('서버 위치 선택 기준'));
          console.log('PASS 48 headings, 34 table lines, 140 bullets, 6/16 options, links, code, nums, JS, English fallback');
          JS
      - name: Start preview and install Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/ko-location-http.log 2>&1 &
          mkdir -p /tmp/ko-location-qa
          cd /tmp/ko-location-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive browser and all form combinations
        run: |
          cd /tmp/ko-location-qa
          mkdir -p shots
          cat > check.cjs <<'JS'
          const a=require('assert').strict,{chromium}=require('playwright');
          const url='http://127.0.0.1:8765/ko/'+encodeURIComponent('vps-서버-위치-선택-방법')+'/';
          const ids=['loc-audience','loc-dynamic','loc-dependency','loc-cdn','loc-compliance','loc-tested'];
          const values=[['concentrated','split','global'],['low','medium','high'],['same','fixed','distributed','none'],['yes','no'],['no','yes'],['no','yes']];
          (async()=>{
            const browser=await chromium.launch();
            try{
              for(const width of [390,1280]){
                const ctx=await browser.newContext({viewport:{width,height:860},isMobile:width===390,hasTouch:width===390});
                const page=await ctx.newPage(),en=await ctx.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto(url,{waitUntil:'load',timeout:60000});
                a.equal(response.status(),200);
                a.equal((await page.title()).trim(),'VPS 서버 위치 선택 방법');
                a.deepEqual(await page.locator('h1').allTextContents(),['VPS 서버 위치 선택 방법']);
                a.equal(await page.locator('h2,h3').count(),48);
                a.equal(await page.locator('table').count(),3);
                a.equal(await page.locator('#vps-location-checker select').count(),6);
                a.equal(await page.locator('#vps-location-checker option').count(),16);
                await en.goto('http://127.0.0.1:8765/how-to-choose-vps-location/',{waitUntil:'domcontentloaded'});
                const extract=p=>p.locator('h2,h3').evaluateAll(nodes=>nodes.map(n=>n.id));
                a.deepEqual(await extract(page),await extract(en),'EN/KO heading anchors');
                a.equal(await page.locator('link[rel="canonical"]').count(),1);
                a((await page.locator('link[rel="canonical"]').getAttribute('href')).endsWith('/ko/vps-서버-위치-선택-방법/'));
                a((await page.locator('.vps-location-hero-diagram').innerText()).includes('지도보다 실제 경로를 선택하세요'));
                a((await page.locator('body').innerText()).includes('고지:'));
                const links=await page.locator('a[href*="partner=ni8gzrvz75"]').evaluateAll(nodes=>nodes.map(x=>x.rel));
                a(links.length>=3&&links.every(x=>x.includes('sponsored')&&x.includes('nofollow')));
                a.equal(await page.locator('a[href^="//"]').count(),0);
                const geom=await page.evaluate(()=>({html:document.documentElement.scrollWidth,body:document.body.scrollWidth}));
                a(geom.html<=width+2&&geom.body<=width+2,'Overflow '+JSON.stringify(geom));
                const anchors=await page.evaluate(()=>[...document.querySelectorAll('a[href*="#"]')].map(el=>new URL(el.href)).filter(u=>u.pathname===location.pathname&&u.hash&&!document.getElementById(decodeURIComponent(u.hash.slice(1)))).map(u=>u.hash));
                a.deepEqual(anchors,[],'same-page anchors');
                await page.screenshot({path:'shots/location-'+width+'.png',fullPage:true});
                if(width===390){
                  let combos=[[]];for(const opts of values)combos=combos.flatMap(c=>opts.map(v=>[...c,v]));
                  a.equal(combos.length,288);
                  const results=await page.evaluate(({ids,combos})=>{
                    const form=document.getElementById('vps-location-checker'),r=document.getElementById('vps-location-result');
                    return combos.map(c=>{ids.forEach((id,i)=>document.getElementById(id).value=c[i]);form.requestSubmit();return r.textContent;});
                  },{ids,combos});
                  const buckets=[0,0,0,0,0,0];
                  for(let i=0;i<combos.length;i++){
                    const [aud,dyn,dep,cdn,compliance,tested]=combos[i];
                    const idx=compliance==='yes'?0:dep==='fixed'&&dyn!=='low'?1:aud==='global'&&dyn==='high'?2:(aud==='global'||aud==='split')&&cdn==='yes'&&dyn!=='high'?3:tested==='no'?4:5;
                    const p=['데이터 위치 제약:','의존 서비스 우선 / 가까운 배치:','다중 지역 검토 가능:','중앙 원본 서버 + CDN:','구매 전 테스트:','사용자 우선 지역:'][idx];
                    a(results[i].startsWith(p),'Form case '+i+': '+results[i]);
                    buckets[idx]++;
                  }
                  console.log('PASS 288 real browser submissions',JSON.stringify(buckets));
                }
                a.deepEqual(errors.filter(s=>!(s.startsWith('Failed to register a ServiceWorker')&&s.includes('does not match the current origin'))),[]);
                console.log('PASS browser',width);
                await ctx.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          JS
          node check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-location-prepublication
          path: /tmp/ko-location-qa/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
