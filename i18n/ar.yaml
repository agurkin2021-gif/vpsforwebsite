? ui_move_to_vps_there_is_a_real_infrastructure_capability_reason_and_operations_ownership_exists_size_the_vps_from_the_measured_workload_then_plan_the_migration
: 'انتقل إلى VPS: يوجد سبب فعلي يتعلق بالبنية التحتية أو الإمكانات، وهناك مسؤول عن التشغيل. حدد موارد VPS وفق عبء العمل المقاس، ثم خطط للنقل.'
? ui_move_with_managed_admin_help_the_vps_case_is_real_but_business_risk_or_missing_operations_ownership_makes_an_unmanaged_move_a_poor_fit_define_administration_security_backups_and_monitoring_before_cutover
