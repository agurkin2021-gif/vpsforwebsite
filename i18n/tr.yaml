: 'ÖNCE OPTİMİZASYON: daha fazla altyapıya para harcamadan önce bilinen uygulama, sorgu, bot, önbellek veya zamanlanmış görev sorununu giderin. Düzeltmeden sonra yeniden ölçün.'
? ui_stay_on_shared_hosting_there_is_no_strong_vps_requirement_yet_keep_the_simpler_platform_until_real_limits_or_a_required_server_capability_appear
: 'PAYLAŞIMLI HOSTİNGDE KALIN: henüz güçlü bir VPS gereksinimi yok. Gerçek kaynak sınırları veya gerekli bir sunucu özelliği ortaya çıkana kadar daha basit platformu kullanın.'
? ui_move_to_vps_there_is_a_real_infrastructure_capability_reason_and_operations_ownership_exists_size_the_vps_from_the_measured_workload_then_plan_the_migration
: 'VPS''E GEÇİN: altyapı veya sunucu yetenekleri açısından gerçek bir gerekçe var ve işletim sorumluluğu üstlenilmiş. VPS kaynaklarını ölçülen iş yüküne göre seçin, ardından taşımayı planlayın.'
? ui_move_with_managed_admin_help_the_vps_case_is_real_but_business_risk_or_missing_operations_ownership_makes_an_unmanaged_move_a_poor_fit_define_administration_security_backups_and_monitoring_before_cutover
: 'YÖNETİM DESTEĞİYLE GEÇİN: VPS ihtiyacı gerçek; ancak iş riski veya işletim sorumlusunun olmaması, yönetim hizmeti almadan geçişi uygunsuz kılıyor. Geçişten önce yönetim, güvenlik, yedekleme ve izleme sorumluluklarını belirleyin.'
? ui_insufficient_evidence_the_case_is_mixed_measure_the_current_bottleneck_and_compare_a_better_shared_managed_option_before_accepting_vps_administration_overhead
: 'YETERSİZ BULGU: durum net değil. VPS yönetiminin ek yükünü üstlenmeden önce mevcut darboğazı ölçün ve daha iyi bir paylaşımlı hosting veya yönetilen hizmet seçeneğiyle karşılaştırın.'
